    // ═══════════════════════════════════════════════════════════════════════════
    // ユーティリティ関数
    // ═══════════════════════════════════════════════════════════════════════════
    function getTier(score) {
      return resultTiers.find((t) => score >= t.range[0] && score <= t.range[1]);
    }

    // ═══════════════════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════════════════

    function TopBar() {
      return (
        <div style={{ background: "#1a1a2e", padding: "14px 24px", display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ color: "#fff", fontWeight: 700, fontSize: 15, letterSpacing: "0.04em", fontFamily: "'Noto Serif JP', serif" }}>

          <span style={{ color: "#7a8a9a", fontSize: 12, fontFamily: "sans-serif" }}>Inc.</span>

    function ProgressBar({ current, total }) {
      const pct = (current / total) * 100;
      return (
        <div style={{ padding: "20px 24px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 12, color: "#7a8a9a" }}>進行状況</span>

            <div
              style={{
                height: "100%",
                width: `${pct}%`,
                background: "linear-gradient(90deg, #2a5e8a, #3a7d6a)",
                borderRadius: 2,
                transition: "width 0.4s ease",
              }}
            />
          </div>
        </div>

          }}

          <span style={{ fontSize: 14 }}>{cat.icon}</span>
          <span style={{ fontSize: 12, color: cat.color, fontWeight: 600 }}>{cat.label}</span>
        </div>
      );
    }

    function QuestionCard({ question, selected, onSelect, index }) {

        <div
          style={{
            background: "#fff",
            borderRadius: 16,
            padding: "28px 24px 20px",

          <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>

                width: 28,
                height: 28,
                borderRadius: 8,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 13,
                fontWeight: 700,
                flexShrink: 0,
              }}
            >
              {index}
            </span>
            <p style={{ margin: 0, fontSize: 16, color: "#1a1a2e", lineHeight: 1.5, fontWeight: 500 }}>
              {question.text}
            </p>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {options.map((opt) => (
              <button
                key={opt.value}
                onClick={() => onSelect(opt.value)}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  padding: "11px 16px",
                  borderRadius: 10,
                  border: selected === opt.value ? "2px solid #2a5e8a" : "1.5px solid #e0e5ea",
                  background: selected === opt.value ? "#eef4fa" : "#fafbfc",
                  cursor: "pointer",
                  transition: "all 0.2s",
                  textAlign: "left",
                }}
              >
                <span
                  style={{
                    width: 20,
                    height: 20,
                    borderRadius: "50%",
                    border: selected === opt.value ? "2px solid #2a5e8a" : "2px solid #cdd3da",
                    background: selected === opt.value ? "#2a5e8a" : "transparent",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                    transition: "all 0.2s",
                  }}
                >
                  {selected === opt.value && <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#fff" }} />}
                </span>
                <span style={{ fontSize: 14, color: selected === opt.value ? "#2a5e8a" : "#4a5568" }}>
                  {opt.label}
                </span>
              </button>
            ))}

        </div>
      );

    function NavButtons({ canBack, canNext, onBack, onNext, nextLabel = "次へ →" }) {
      return (
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24, gap: 12 }}>
          {canBack ? (
            <button
              onClick={onBack}

                padding: "10px 20px",
                borderRadius: 10,
                border: "1.5px solid #dde3ea",
                background: "#fff",

              }}

            </button>
          ) : (
            <span />

            onClick={onNext}
            disabled={!canNext}
            style={{
              padding: "10px 28px",
              borderRadius: 10,
              border: "none",
              background: canNext ? "linear-gradient(135deg, #1a1a2e, #2a5e8a)" : "#ccc",

              fontSize: 14,
              fontWeight: 600,
              cursor: canNext ? "pointer" : "not-allowed",
              boxShadow: canNext ? "0 2px 10px rgba(26,26,46,0.3)" : "none",
            }}

          </button>

    // ═══════════════════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════════════════

    function StartScreen({ onStart }) {

          <h1 style={{ fontFamily: "'Noto Serif JP', serif", fontSize: 24, color: "#1a1a2e", margin: "0 0 8px", lineHeight: 1.3 }}>

            </p>

                <span style={{ fontSize: 14, color: "#4a5568" }}>{item}</span>

            </div>
            <div style={{ width: 1, background: "#dde3ea" }} />
            <div style={{ textAlign: "center" }}>

          </div>
          <button

              padding: "16px",

              border: "none",
              background: "linear-gradient(135deg, #1a1a2e, #2a5e8a)",

              fontSize: 17,

          </button>

      );

    function QuizScreen({ answers, onAnswer, onBack, onFinish }) {
      const currentIndex = Object.keys(answers).length;
      let currentQ = null;
      let currentQIndex = 0;
      for (let i = 0; i < questions.length; i++) {
        if (answers[questions[i].id] === undefined) {
          currentQ = questions[i];
          currentQIndex = i;
          break;
        }
      }
      if (!currentQ) return null;

      const answered = Object.keys(answers).length;
      const isLast = answered === questions.length - 1;

      return (
        <div style={{ padding: "16px 20px 24px" }}>
          <ProgressBar current={answered} total={questions.length} />
          <div style={{ marginTop: 20 }}>
            <QuestionCard
              question={currentQ}
              selected={answers[currentQ.id]}
              onSelect={(val) => onAnswer(currentQ.id, val)}
              index={currentQIndex + 1}
            />
          </div>
          <NavButtons
            canBack={answered > 0}
            onBack={onBack}
            canNext={answers[currentQ.id] !== undefined}
            onNext={isLast && answers[currentQ.id] !== undefined ? onFinish : () => { }}
            nextLabel={isLast ? "結果を見る" : "次へ →"}
          />
        </div>
      );
    }

    function ResultScreen({ answers, onRestart }) {
      const [email, setEmail] = useState("");
      const [name, setName] = useState("");
      const [emailSent, setEmailSent] = useState(false);
      const [sending, setSending] = useState(false);

      const total = Object.values(answers).reduce((a, b) => a + b, 0);
      const tier = getTier(total);
      const pdfUrl = PDF_LINKS[tier.id];

      const handleSubmit = async () => {
        if (!email || !name) {
          alert("お名前とメールアドレスを入力してください");
          return;
        }

        setSending(true);
        try {
          const payload = {
            name,
            email,
            score: total,
            tier: tier.label,
            timestamp: new Date().toISOString(),
          };

          await fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          setEmailSent(true);
        } catch (error) {
          console.error("送信エラー:", error);
          alert("送信に失敗しました。もう一度お試しください。");
        } finally {
          setSending(false);
        }
      };

      return (
        <div style={{ padding: "20px 20px 32px" }}>
          {/* スコアヒーロー */}
          <div
            style={{
              background: tier.bg,
              border: `1px solid ${tier.color}30`,
              borderRadius: 18,
              padding: "28px 20px 24px",
              textAlign: "center",
              marginBottom: 20,
            }}
          >
            <div style={{ fontSize: 28, marginBottom: 4 }}>{tier.badge}</div>
            <div style={{ fontSize: 13, color: tier.color, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 }}>
              診断結果
            </div>
            <div style={{ fontFamily: "'Noto Serif JP', serif", fontSize: 22, color: "#1a1a2e", fontWeight: 700, marginBottom: 4 }}>
              {tier.label}
            </div>
            <div style={{ fontSize: 14, color: "#5a6a7a", marginBottom: 16 }}>{tier.subtitle}</div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 4 }}>
              <span style={{ fontSize: 52, fontWeight: 800, color: tier.color, lineHeight: 1 }}>{total}</span>
              <span style={{ fontSize: 18, color: "#7a8a9a" }}>/60</span>
            </div>
          </div>

          {/* メッセージ */}
          <div style={{ background: "#fff", borderRadius: 16, border: "1px solid #eef2f6", padding: "20px", marginBottom: 16, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
            <p style={{ margin: 0, fontSize: 14, color: "#4a5568", lineHeight: 1.7 }}>{tier.message}</p>
          </div>

          {/* 事例 */}
          <div style={{ background: "#f9f7f2", borderRadius: 16, border: "1px solid #efe9dc", padding: "20px", marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <span style={{ fontSize: 16 }}>💬</span>
              <span style={{ fontSize: 13, color: "#8a7a5a", fontWeight: 700 }}>{tier.story.title}</span>
            </div>
            <p style={{ margin: "0 0 6px", fontSize: 12, color: "#9a8a6a", fontStyle: "italic" }}>
              — {tier.story.industry}
            </p>
            <p style={{ margin: 0, fontSize: 14, color: "#5a4a2a", lineHeight: 1.7 }}>
              {tier.story.text}
            </p>
          </div>

          {/* メール取得 + PDF表示 */}
          <div style={{ background: "#fff", borderRadius: 16, border: "1px solid #eef2f6", padding: "20px", marginBottom: 16, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
            <h3 style={{ margin: "0 0 4px", fontSize: 15, color: "#1a1a2e" }}>
              診断結果のPDFを受け取る
            </h3>
            <p style={{ margin: "0 0 14px", fontSize: 13, color: "#7a8a9a" }}>
              詳細レポートをメールでお送りします
            </p>
            {!emailSent ? (
              <>
                <input
                  type="text"
                  placeholder="お名前"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  style={{
                    width: "100%",
                    padding: "12px 14px",
                    borderRadius: 10,
                    border: "1.5px solid #dde3ea",
                    fontSize: 14,
                    boxSizing: "border-box",
                    marginBottom: 10,
                    outline: "none",
                  }}
                />
                <input
                  type="email"
                  placeholder="メールアドレス"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  style={{
                    width: "100%",
                    padding: "12px 14px",
                    borderRadius: 10,
                    border: "1.5px solid #dde3ea",
                    fontSize: 14,
                    boxSizing: "border-box",
                    marginBottom: 10,
                    outline: "none",
                  }}
                />
                <button
                  onClick={handleSubmit}
                  disabled={sending || !email || !name}
                  style={{
                    width: "100%",
                    padding: "12px",
                    borderRadius: 10,
                    border: "none",
                    background: (email && name && !sending) ? "#2a5e8a" : "#cdd3da",
                    color: "#fff",
                    fontSize: 14,
                    fontWeight: 600,
                    cursor: (email && name && !sending) ? "pointer" : "default",
                    transition: "background 0.2s",
                  }}
                >
                  {sending ? "送信中..." : "結果を受け取る"}
                </button>
              </>
            ) : (
              <div style={{ background: "#eef6fc", borderRadius: 10, padding: "14px", textAlign: "center" }}>
                <p style={{ margin: 0, fontSize: 14, color: "#2a5e8a", fontWeight: 600 }}>
                  ✓ ありがとうございます
                </p>
                <p style={{ margin: "4px 0 12px", fontSize: 13, color: "#5a6a7a" }}>
                  {email} へPDFを送付いたします
                </p>
                {pdfUrl && !pdfUrl.includes("PLACEHOLDER") && (
                  <a
                    href={pdfUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{
                      display: "inline-block",
                      padding: "10px 20px",
                      borderRadius: 8,
                      background: "#2a5e8a",
                      color: "#fff",
                      fontSize: 13,
                      fontWeight: 600,
                      textDecoration: "none",
                      marginTop: 8,
                    }}
                  >
                    📄 今すぐPDFをダウンロード
                  </a>
                )}
              </div>
            )}
          </div>

          {/* CTA */}
          <div style={{ background: "#1a1a2e", borderRadius: 16, padding: "24px 20px", marginBottom: 16 }}>
            <p style={{ margin: "0 0 16px", fontSize: 14, color: "#c8d4e0", lineHeight: 1.7 }}>
              今の状況を、一緒に見直しましょう。
            </p>
            <a
              href="https://1planet.jp/contact"
              target="_blank"
              rel="noopener noreferrer"
              style={{
                display: "block",
                width: "100%",
                padding: "14px",
                borderRadius: 10,
                border: "none",
                background: "linear-gradient(135deg, #2a5e8a, #3a7d6a)",
                color: "#fff",
                fontSize: 15,
                fontWeight: 700,
                cursor: "pointer",
                boxShadow: "0 2px 10px rgba(0,0,0,0.3)",
                textAlign: "center",
                textDecoration: "none",
              }}
            >
              {tier.cta.primary}
            </a>
            <p style={{ margin: "12px 0 0", fontSize: 11, color: "#6a7a8a", textAlign: "center" }}>
              毎月2社限定 | 無理な営業はありません
            </p>
          </div>

          {/* やり直し */}
          <button
            onClick={onRestart}
            style={{
              width: "100%",
              padding: "10px",
              borderRadius: 10,
              border: "1.5px solid #dde3ea",
              background: "#fff",
              color: "#7a8a9a",
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            もう一度診断する
          </button>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // メインアプリ
    // ═══════════════════════════════════════════════════════════════════════════
    function App() {
      const [screen, setScreen] = useState("start");
      const [answers, setAnswers] = useState({});
      const [history, setHistory] = useState([]);

      function handleStart() {
        setScreen("quiz");
        setAnswers({});
        setHistory([]);
      }

      function handleAnswer(qId, val) {
        setAnswers((prev) => ({ ...prev, [qId]: val }));
        if (!history.includes(qId)) {
          setHistory((prev) => [...prev, qId]);
        }
      }

      function handleBack() {
        if (history.length === 0) return;
        const lastQId = history[history.length - 1];
        setAnswers((prev) => {
          const next = { ...prev };
          delete next[lastQId];
          return next;
        });
        setHistory((prev) => prev.slice(0, -1));
      }

      function handleFinish() {
        setScreen("result");
      }

      function handleRestart() {
        setScreen("start");
        setAnswers({});
        setHistory([]);
      }

      useEffect(() => {
        const answered = Object.keys(answers).length;
        if (answered === questions.length && screen === "quiz") {
          const t = setTimeout(() => setScreen("result"), 400);
          return () => clearTimeout(t);
        }
      }, [answers, screen]);

      useEffect(() => {
        if (screen !== "quiz") return;
        const currentQ = questions.find((q) => answers[q.id] === undefined);
        if (!currentQ) return;
      }, [answers, screen]);

      return (
        <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "#f0f3f7" }}>
          <TopBar />
          {screen === "start" && <StartScreen onStart={handleStart} />}
          {screen === "quiz" && (
            <QuizScreen
              answers={answers}
              onAnswer={(qId, val) => {
                handleAnswer(qId, val);
                setTimeout(() => {
                  const newAnswers = { ...answers, [qId]: val };
                  if (Object.keys(newAnswers).length === questions.length) {
                    setScreen("result");
                  }
                }, 350);
              }}
              onBack={handleBack}
              onFinish={handleFinish}
            />
          )}
          {screen === "result" && <ResultScreen answers={answers} onRestart={handleRestart} />}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // レンダリング
    // ═══════════════════════════════════════════════════════════════════════════
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
